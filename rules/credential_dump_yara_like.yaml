title: Credential Dumping Tradecraft (YARA-like)
description: Token-based multi-hit matching across command/metadata fields.
severity: 92
detection:
  yara_like:
    fields: ["command_line", "metadata", "resource"]
    strings:
      - "lsass"
      - "sekurlsa"
      - "mimikatz"
      - "credential dump"
    min_hits: 2
