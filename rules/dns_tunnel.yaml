title: Possible DNS Tunneling
description: Detects many DNS queries combined with long-query/TXT indicators that may indicate tunneling.
severity: 86
detection:
  equals:
    action: dns_query
  windowed_count:
    field: metadata.dns_query_name
    identity_field: host
    window_seconds: 3600
    count_threshold: 200
    min_distinct_values: 25
  additional_checks:
    - field: metadata.dns_query_length
      greater_than: 64
    - field: metadata.dns_record_type
      equals: TXT
