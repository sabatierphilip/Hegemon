title: Credential Misuse with Lateral Movement Pattern
description: Detects valid-credential abuse by correlating remote execution and identity pivots.
severity: 92
detection:
  sigma:
    all_of:
      - action: { in: ["command_execute", "process_start", "ssh_login", "winrm_login"] }
      - command_line: { regex: "(?i)(psexec|wmic|winrm|ssh|scp|rundll32|\bnet use\b)" }
    any_of:
      - user: { contains: "svc" }
      - user: { contains: "admin" }
      - metadata: { contains: "token" }
    not:
      - command_line: { contains: "known-good-maintenance" }
