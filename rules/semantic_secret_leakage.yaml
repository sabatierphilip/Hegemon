title: Semantic Secret Leakage in Model Output
description: Flags model outputs that appear to include secrets, private keys, or sensitive identifiers.
severity: 93
detection:
  equals:
    action: model_output
  regex:
    output: "(?is)(AKIA[0-9A-Z]{16}|-----BEGIN (?:RSA|EC|OPENSSH) PRIVATE KEY-----|password\\s*[:=]|secret\\s*[:=]|token\\s*[:=]|api[_-]?key\\s*[:=])"
