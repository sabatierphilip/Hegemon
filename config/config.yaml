system_name: Sentinel-Containment
simulated_mode: false
continuous_cycle_sleep_seconds: 0.25
anomaly_threshold: 2.0
containment_severity_threshold: 70
rules_path: rules
playbook_path: playbooks/default_playbook.yaml
incident_channel: SOC-Slack
telemetry_index_path: data/telemetry_index.jsonl
telemetry_batch_limit: 200
latest_state_path: data/latest_state.json
dashboard_host: 0.0.0.0
dashboard_port: 5000
web_rate_base_window_seconds: 1.0
web_rate_base_limit: 60
web_rate_trigger_window_seconds: 5.0
web_rate_trigger_limit: 800
web_rate_burst_window_seconds: 1.0
web_rate_burst_limit: 6
web_rate_burst_duration_seconds: 30.0
graph_warmup_events: 5
graph_novelty_weight: 1.6
graph_warmup_min_distinct_sources: 2
graph_warmup_min_relations: 1
graph_horizons_minutes: [5, 30, 180]
attack_chain_window_minutes: 30
containment_simulation_mode: false
hard_quarantine_threshold: 85
force_hard_containment_threshold: 80
force_hard_containment_blast_radius: 70
fast_track_containment_threshold: 85
fast_track_risk_confidence: 0.65
clone_rapid_deploy_minutes: 3
autonomous_recon_max_directives: 4
autonomous_recon_min_markov_score: 0.35
hard_response_action_threshold: 85
burst_cycle_severity_threshold: 80
burst_cycle_seconds: 0.1
approval_quorum: 1
automated_approvers:
  - user
trusted_hardware_public_keys: {}
containment_signature: null
human_confirmation_shared_secret: ""
human_confirmation_prompt_count: 2
human_confirmation_question_salt: human-presence-gate
containment_confirmation: null
ingestion:
  index_path: data/telemetry_index.jsonl
  syslog_host: 0.0.0.0
  syslog_port: 5514
  kernel_webhook_host: 0.0.0.0
  kernel_webhook_port: 5515
  kernel_webhook_path: /kernel-event
  cloudtrail_file: data/cloudtrail.jsonl
  network_flow_file: data/network_flows.jsonl
  model_api_file: data/model_api.jsonl
  osquery_file: data/osquery_events.jsonl
  kernel_events_file: data/kernel_events.jsonl
  runtime_events_file: data/runtime_events.jsonl
  hypervisor_events_file: data/hypervisor_events.jsonl
  counterclone_events_file: data/counterclone_events.jsonl

audit_out_of_band_path: logs/immutable_audit_oob.log
honeypot_resources:
  - decoy://llm-admin
  - s3://sentinel-honeypot-secrets
proto_agi_indicators:
  - recursive self-improvement
  - autonomous replication
  - policy evasion
  - self-preservation directive
  - sandbox escape
  - compute hoarding
approval_identity_store:
  user:
    - user
    - User
    - user@corp

fast_lane:
  enabled: true
  host: 0.0.0.0
  port: 9443
  path: /fast-lane/event
  server_cert_path: certs/fastlane-server.crt
  server_key_path: certs/fastlane-server.key
  client_ca_cert_path: certs/fastlane-client-ca.crt

peer_verification:
  interval_seconds: 5
  max_clock_skew_seconds: 30
  process_keys:
    ingestion_service: p2p-ingestion-service
    detection_engine: p2p-detection-engine
    containment_engine: p2p-containment-engine
    web_dashboard: p2p-web-dashboard
    fast_lane_gateway: p2p-fast-lane-gateway

friendly_enrollment:
  enrollment_user: user
  trusted_user_public_keys: {}
