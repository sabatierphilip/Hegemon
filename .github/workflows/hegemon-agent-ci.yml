name: hegemon-agent-ci

on:
  push:
    paths:
      - 'hegemon_agent.py'
      - 'control_plane_service.py'
      - 'secure_key_store.py'
      - 'signed_ledger.py'
      - 'wasm_security.py'
      - 'attestation.py'
      - 'kernel_telemetry.py'
      - 'phase5_update.py'
      - 'phase6_controlplane.py'
      - 'phase9_capabilities.py'
      - 'phase7_containment.py'
      - 'tests/test_hegemon_agent.py'
      - 'requirements.txt'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint syntax
        run: python -m py_compile hegemon_agent.py control_plane_service.py secure_key_store.py signed_ledger.py wasm_security.py attestation.py kernel_telemetry.py phase5_update.py phase6_controlplane.py phase7_containment.py phase9_capabilities.py
      - name: Run tests
        run: pytest -q tests/test_hegemon_agent.py
